*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.bar{background:#111;color:#fff;font-size:13px;text-align:center;padding:6px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 8px #0001}
.logo{font-weight:800;font-size:22px;color:var(--a)}.row{display:flex;gap:10px;align-items:center}
button{white-space:nowrap;font:inherit;cursor:pointer;border:0;border-radius:999px;padding:9px 18px;background:var(--a);color:#fff;font-weight:700}button.ghost{background:#fff;color:var(--a);border:1px solid var(--a)}
.hero{padding:90px 5vw;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),var(--hero) center/cover;color:#fff;text-align:center}.hero h1{font-size:clamp(28px,5vw,48px);margin-bottom:10px}.hero p{max-width:560px;margin:0 auto 20px;opacity:.95}
.cats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:22px 5vw}.cats button{background:#fff;color:var(--ink);border:1px solid #ddd}.cats button.on{background:var(--a);color:#fff;border-color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding:0 5vw 40px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px #0001;display:flex;flex-direction:column}
.pic{aspect-ratio:1/1;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.price{font-weight:800;color:var(--a)}.info .row{margin-top:auto;justify-content:space-between}
.extras{background:#fff;margin:0 5vw 30px;padding:18px;border-radius:18px}.extras label{display:inline-flex;gap:6px;margin:6px 14px 6px 0}
.panel{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(380px,100%);background:#fff;box-shadow:0 0 30px #0004;padding:20px;transform:translateX(-110%);transition:.25s;z-index:20;overflow:auto}[dir=rtl] .panel{transform:translateX(110%);inset-inline-start:auto;right:0}.panel.open{transform:none!important}
.panel input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:10px;font:inherit}.li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
footer{background:#111;color:#bbb;text-align:center;padding:22px 5vw;font-size:13px}.badge{display:inline-block;background:#fff3;border-radius:999px;padding:3px 12px;font-size:12px;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;display:none;z-index:30}
</style><style>
html{scroll-behavior:smooth}
nav.links{display:flex;gap:18px;flex-wrap:wrap}nav.links a{color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}nav.links a:hover{color:var(--a)}
.sec{padding:48px 5vw}.sec h2{font-size:26px;margin-bottom:18px;color:var(--ink)}.sec.alt{background:#fff}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:22px 5vw;background:#fff}.trust div{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:14px;background:var(--bg)}.trust b{color:var(--a)}.trust small{color:#555}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}.stats div{background:var(--bg);padding:12px 18px;border-radius:14px;text-align:center}.stats b{display:block;font-size:22px;color:var(--a)}
.why{list-style:none;display:grid;gap:10px}.why li{background:var(--bg);padding:12px 16px;border-radius:12px}.why li:before{content:"✓ ";color:var(--a);font-weight:800}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.box{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px #0001}.sec.alt .box{background:var(--bg);box-shadow:none}.box h3{margin-bottom:6px;color:var(--a);font-size:18px}
.stars{color:#f5a623;letter-spacing:2px}.small{font-size:12px;color:#666;margin-top:12px}
details{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:10px;box-shadow:0 1px 6px #0001}summary{cursor:pointer;font-weight:700}details p{margin-top:8px;color:#444}
.nl{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;text-align:center}.nl h2{color:#fff}.nl form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.nl input{padding:11px 16px;border-radius:999px;border:0;min-width:240px;font:inherit}.nl button{background:#111}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:28px}.contact form{display:grid;gap:10px}.contact input,.contact textarea{padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit;width:100%}.cinfo p{margin:8px 0}.cinfo span{display:block;font-size:12px;color:#777}
.ok{color:var(--a);font-weight:700;min-height:22px;margin-top:6px}
.cs{display:flex;gap:10px;flex-wrap:wrap}.cs a{padding:9px 16px;border-radius:999px;border:1px solid var(--a);color:var(--a);text-decoration:none;font-weight:600}
footer.big{background:#111;color:#bbb;padding:40px 5vw 18px;text-align:start;font-size:14px}.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px}.fcols h4{color:#fff;margin-bottom:10px}.fcols a{display:block;color:#bbb;text-decoration:none;margin:5px 0}.fcols a:hover{color:#fff}
.soc{display:flex;gap:10px;margin:8px 0}.soc a{display:inline-flex;width:36px;height:36px;border-radius:50%;background:#333;color:#fff;align-items:center;justify-content:center;font-weight:800;margin:0}
.pay{display:flex;gap:8px;flex-wrap:wrap}.pay span{background:#333;color:#fff;border-radius:6px;padding:3px 10px;font-size:12px}
.fbot{border-top:1px solid #333;margin-top:24px;padding-top:14px;text-align:center;font-size:13px}
.chatbtn{position:fixed;bottom:18px;inset-inline-end:18px;z-index:25;box-shadow:0 4px 16px #0004;padding:13px 20px}
.chat{position:fixed;bottom:76px;inset-inline-end:18px;width:min(340px,calc(100vw - 36px));background:#fff;border-radius:18px;box-shadow:0 8px 30px #0004;z-index:25;display:none;flex-direction:column;overflow:hidden}.chat.open{display:flex}
.chat header{position:static;background:var(--a);color:#fff;padding:12px 16px;box-shadow:none;font-weight:700}
.msgs{padding:12px;height:230px;overflow:auto;display:flex;flex-direction:column;gap:8px;background:#fafafa}.m{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;background:#e9ecef}.m.me{align-self:flex-end;background:var(--a);color:#fff}
.qs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px}.qs button{background:#fff;color:var(--a);border:1px solid var(--a);padding:5px 10px;font-size:12px}
.cin{display:flex;gap:6px;padding:10px;border-top:1px solid #eee}.cin input{flex:1;padding:8px 10px;border:1px solid #ccc;border-radius:999px;font:inherit;min-width:0}
@media(max-width:760px){.two,.contact{grid-template-columns:1fr}nav.links{display:none}header{padding:10px 4vw}.sec{padding:34px 5vw}}
</style></head><body>

let lang='ar',cat='all',cart=[],chatInit=false;
const $=id=>document.getElementById(id);
function tr(k){return T[lang][k]}
function money(n){return n+' '+tr('cur')}
function demo(e,k,id){e.preventDefault();$(id).textContent=tr(k);e.target.reset();return false}
function soc(){const t=$('toast');t.textContent=tr('soc');t.style.display='block';setTimeout(()=>t.style.display='none',2500);return false}
function bot(t){const m=document.createElement('div');m.className='m';m.textContent=t;$('msgs').appendChild(m);$('msgs').scrollTop=1e6}
function me(t){const m=document.createElement('div');m.className='m me';m.textContent=t;$('msgs').appendChild(m)}
function say(e){e.preventDefault();const v=$('cin').value.trim();if(!v)return false;me(v);$('cin').value='';setTimeout(()=>bot(tr('chatAuto')),500);return false}
function ask(i){me(tr('qa'+i));setTimeout(()=>bot(tr('qa'+i+'a')),400)}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
 for(const k of ['bar','logo','badge','h1','sub','shop','exT','cT','buy','note','foot'])$(k).textContent=tr(k);
 document.querySelectorAll('[data-k]').forEach(e=>e.textContent=tr(e.dataset.k));
 $('flogo').textContent=tr('logo');
 $('lang').textContent=lang=='ar'?'English':'عربي';
 $('nm').placeholder=tr('nm');$('ph').placeholder=tr('ph');$('ad').placeholder=tr('ad');
 $('nlp').placeholder=tr('nlP');$('ctn').placeholder=tr('ctN');$('cte').placeholder=tr('ctE');$('ctmsg').placeholder=tr('ctM');$('cin').placeholder=tr('chatIn');$('csend').textContent=tr('chatSend');
 $('cartBtn').textContent=tr('cart')+' ('+cart.length+')';
 $('chatBtn').textContent=tr('chatBtn');$('chatH').textContent=tr('chatT');
 $('qs').innerHTML=[1,2].map(i=>`<button onclick="ask(${i})">${tr('qa'+i)}</button>`).join('');
 $('msgs').innerHTML='';bot(tr('chatHi'));
 $('why').innerHTML=tr('why').map(x=>`<li>${x}</li>`).join('');
 $('ts').innerHTML=tr('ts').map(x=>`<div class="box"><div class="stars">★★★★★</div><p>${x[1]}</p><b>${x[0]}</b> <small>(${tr('sOK')})</small></div>`).join('');
 $('faqs').innerHTML=tr('faq').map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('');
 $('cats').innerHTML=['all',...new Set(P.map(p=>p.c))].map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${c}';render()">${c=='all'?tr('all'):tr('c_'+c)}</button>`).join('');
 $('grid').innerHTML=P.filter(p=>cat=='all'||p.c==cat).map(p=>`<div class="card"><div class="pic"><img src="${IMG[p.id]}" alt="${p.en}"></div><div class="info"><b>${p[lang]}</b><small>${p['d'+lang]}</small><div class="row"><span class="price">${money(p.p)}</span><button onclick="add(${p.id})">${tr('buyNow')}</button></div></div></div>`).join('');
 const ex=T.ar&&EX;$('ex').innerHTML=ex.map((x,i)=>`<label><input type="checkbox" id="x${i}" onchange="upd()" ${extrasOn[i]?'checked':''}> ${x[lang]} (+${x.p})</label>`).join('');
 upd();
}
const EX=[{"ar": "تغليف هدية", "en": "Gift wrap", "p": 25}, {"ar": "ضمان إضافي", "en": "Extra warranty", "p": 90}];
let extrasOn={};
function upd(){
 EX.forEach((x,i)=>{const el=$('x'+i);if(el)extrasOn[i]=el.checked});
 let sum=cart.reduce((s,p)=>s+p.p,0)+(cart.length?EX.reduce((s,x,i)=>s+(extrasOn[i]?x.p:0),0):0);
 $('lines').innerHTML=cart.map(p=>`<div class="li"><span>${p[lang]}</span><span>${money(p.p)}</span></div>`).join('')||`<p>${tr('empty')}</p>`;
 $('tot').textContent=tr('total')+': '+money(sum);
}
function add(id){cart.push(P.find(p=>p.id==id));$('panel').classList.add('open');render()}
$('lang').onclick=()=>{lang=lang=='ar'?'en':'ar';render()};
$('cartBtn').onclick=()=>$('panel').classList.add('open');$('close').onclick=()=>$('panel').classList.remove('open');
$('shop').onclick=()=>$('shopSec').scrollIntoView({behavior:'smooth'});
$('chatBtn').onclick=()=>$('chat').classList.toggle('open');
$('buy').onclick=()=>{const t=$('toast');t.textContent=tr('demo');t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
render();
</script></body></html>
